[project]
name = "agent-template"
version = "0.1.0"
description = "Agent procode template with clean architecture"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.48.2",
    "fastapi[standard]>=0.121.1",
    "langchain-mcp-adapters>=0.1.12",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.3",
    "langchain>=1.0.5",
    "aiokafka>=0.12.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0",
    "opentelemetry-instrumentation-aiokafka>=0.59b0",
    "opentelemetry-instrumentation-langchain>=0.48.0",
    "opentelemetry-instrumentation-fastapi",
    "redis",
    "langgraph-checkpoint-redis",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiobotocore>=2.15.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit-test"]
pythonpath = ["."]
